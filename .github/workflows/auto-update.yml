name: Helium Auto Update

on:
  schedule:
    - cron: "0 8 * * *" # runs every day at 08:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: helium-flatpak-publish
  cancel-in-progress: false

jobs:
  # 1. Update the manifest file.
  update-manifest:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run update script
        run: bash ./grab_latest.sh

      - name: Check and commit
        id: check
        run: |
          git config --global user.name "helium-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s net.imput.helium.yml) ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            VERSION=$(grep -m1 'version:' version.txt | awk '{print $2}')
            git add net.imput.helium.yml net.imput.helium.metainfo.xml version.txt
            git commit -m "update: helium $VERSION"
            git push origin HEAD:main
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Build both native architectures. Manual runs also rebuild the current
  # version, which is useful for initially publishing or repairing the repo.
  build-flatpak:
    needs: update-manifest
    if: needs.update-manifest.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - flatpak_arch: x86_64
            file_arch: x86_64
            runner: ubuntu-latest
          - flatpak_arch: aarch64
            file_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Mark safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Setup Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build repository and bundle
        run: |
          VERSION=$(grep -m1 'version:' version.txt | awk '{print $2}')
          flatpak-builder \
            --arch=${{ matrix.flatpak_arch }} \
            --user \
            --repo=repo \
            --force-clean \
            --install-deps-from=flathub \
            build-dir net.imput.helium.yml
          flatpak build-bundle \
            --arch=${{ matrix.flatpak_arch }} \
            repo \
            "helium-${VERSION}-${{ matrix.file_arch }}.flatpak" \
            net.imput.helium
          tar -C repo -cf "flatpak-repo-${{ matrix.flatpak_arch }}.tar" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.file_arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            *.flatpak
            flatpak-repo-*.tar

  # 3. Keep standalone bundles available through GitHub Releases. This is
  # idempotent so manual rebuilds can create a missing release or replace its
  # assets without creating a duplicate.
  release:
    needs: [update-manifest, build-flatpak]
    if: needs.update-manifest.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 'version:' version.txt | awk '{print $2}')
          IS_PRERELEASE=$(grep -m1 'prerelease:' version.txt | awk '{print $2}')
          FLAGS=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" artifacts/*.flatpak --clobber
          else
            gh release create "$VERSION" \
              artifacts/*.flatpak \
              --target main \
              --title "$VERSION" \
              --notes "Automated update to Helium version $VERSION" \
              --generate-notes \
              "${FLAGS[@]}"
          fi

  # 4. Merge both native repositories, sign their commits and summary, then
  # publish the repository to Cloudflare R2. Immutable data goes up before the
  # summary so clients never see references to objects that are not uploaded.
  publish-repository:
    needs: [update-manifest, build-flatpak]
    if: needs.update-manifest.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: flatpak-repository
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download architecture repositories
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Install publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree rclone

      - name: Import signing key
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY_B64 }}
        run: |
          : "${PRIVATE_KEY:?FLATPAK_GPG_PRIVATE_KEY_B64 is not configured}"
          : "${GPG_KEY_ID:?FLATPAK_GPG_KEY_ID is not configured}"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$PRIVATE_KEY" | base64 --decode | gpg --batch --homedir "$GNUPGHOME" --import
          gpg --batch --homedir "$GNUPGHOME" --list-secret-keys "$GPG_KEY_ID"

      - name: Restore published repository
        run: |
          : "${R2_BUCKET:?R2_BUCKET is not configured}"
          mkdir -p repo
          rclone lsf "r2:$R2_BUCKET" --max-depth 1 > "$RUNNER_TEMP/r2-root.txt"
          if grep -Fxq "config" "$RUNNER_TEMP/r2-root.txt"; then
            rclone copy \
              "r2:$R2_BUCKET" repo/ \
              --exclude "helium.flatpakrepo"

            # Object storage does not preserve empty OSTree directories. In
            # particular, static-delta generation requires refs/remotes.
            mkdir -p \
              repo/extensions \
              repo/objects \
              repo/refs/heads \
              repo/refs/mirrors \
              repo/refs/remotes \
              repo/state \
              repo/tmp/cache
          else
            ostree init --repo=repo --mode=archive-z2
          fi

      - name: Merge and sign architecture commits
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          for ARCH in x86_64 aarch64; do
            SOURCE_REPO="$RUNNER_TEMP/repo-$ARCH"
            REF="app/net.imput.helium/$ARCH/master"
            mkdir -p "$SOURCE_REPO"
            tar -xf "artifacts/flatpak-repo-$ARCH.tar" -C "$SOURCE_REPO"
            ostree rev-parse --repo="$SOURCE_REPO" "$REF"
            flatpak build-commit-from \
              --src-repo="$SOURCE_REPO" \
              --src-ref="$REF" \
              --update-appstream \
              --no-summary-index \
              --gpg-sign="$GPG_KEY_ID" \
              --gpg-homedir="$GNUPGHOME" \
              repo "$REF"
          done

          flatpak build-update-repo repo \
            --title="Helium" \
            --comment="Private, fast, and honest web browser" \
            --homepage="https://github.com/NiHaiden/helium-flatpak" \
            --default-branch=master \
            --generate-static-deltas \
            --no-summary-index \
            --gpg-import=helium-flatpak.gpg \
            --gpg-sign="$GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME"

          test -s repo/summary
          test -s repo/summary.sig
          ostree refs --repo=repo

      - name: Upload repository to R2
        run: |
          # We intentionally use copy rather than sync so older objects are not
          # deleted while clients may still have an older summary cached.
          rclone copy repo/objects/ "r2:$R2_BUCKET/objects/"

          if [[ -d repo/deltas ]]; then
            rclone copy repo/deltas/ "r2:$R2_BUCKET/deltas/"
          fi

          # Upload mutable repository metadata after every referenced object is
          # present, but hold back the signed summary until the very end.
          rclone copy \
            repo/ "r2:$R2_BUCKET/" \
            --exclude ".lock" \
            --exclude "objects/**" \
            --exclude "deltas/**" \
            --exclude "summary" \
            --exclude "summary.sig"

          # Upload the detached signature first and the summary last. Force
          # these small pointer files to be replaced even if their sizes match.
          rclone copyto \
            repo/summary.sig "r2:$R2_BUCKET/summary.sig" \
            --ignore-times
          rclone copyto \
            repo/summary "r2:$R2_BUCKET/summary" \
            --ignore-times
          rclone copyto \
            helium.flatpakrepo "r2:$R2_BUCKET/helium.flatpakrepo" \
            --ignore-times
